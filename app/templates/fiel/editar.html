{% extends "base.html" %}
{% block title %}Editar Empresa - CFDISAT{% endblock %}
{% block content %}
<h1>Editar Empresa: {{ empresa.rfc }}</h1>

<div class="form-container">
    <form method="POST" enctype="multipart/form-data" class="form-card">
        <div class="form-group">
            <label for="razon_social">Razon Social</label>
            <input type="text" id="razon_social" name="razon_social" value="{{ empresa.razon_social }}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="cer_file">Actualizar Certificado (.cer) - Opcional</label>
                <input type="file" id="cer_file" name="cer_file" accept=".cer">
            </div>
            <div class="form-group">
                <label for="key_file">Actualizar Llave Privada (.key) - Opcional</label>
                <input type="file" id="key_file" name="key_file" accept=".key">
            </div>
        </div>

        <div class="form-group">
            <label for="password">Nueva Contrasena FIEL - Opcional</label>
            <input type="password" id="password" name="password" placeholder="Dejar vacio para no cambiar">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <a href="{{ url_for('fiel.configurar_fiel') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
