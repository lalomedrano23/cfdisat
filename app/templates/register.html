{% extends "base.html" %}
{% block title %}Registro - CFDISAT{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Crear Cuenta</h1>
        <form method="POST">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label for="email">Correo electronico</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label for="password">Contrasena</label>
                <input type="password" id="password" name="password" required placeholder="Minimo 6 caracteres">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmar contrasena</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repite tu contrasena">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Crear Cuenta</button>
        </form>
        <p class="auth-link">Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesion</a></p>
    </div>
</div>
{% endblock %}
