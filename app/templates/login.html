{% extends "base.html" %}
{% block title %}Iniciar Sesion - CFDISAT{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Iniciar Sesion</h1>
        <form method="POST">
            <div class="form-group">
                <label for="email">Correo electronico</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label for="password">Contrasena</label>
                <input type="password" id="password" name="password" required placeholder="Tu contrasena">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>
        <p class="auth-link">No tienes cuenta? <a href="{{ url_for('auth.register') }}">Registrate</a></p>
    </div>
</div>
{% endblock %}
